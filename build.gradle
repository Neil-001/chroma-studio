plugins {
	id 'net.ltgt.errorprone' version '5.2.0' apply false
}

subprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group

	plugins.withId('java') {
		base {
			archivesName = "${rootProject.archives_base_name}-${project.name}"
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = 21
			it.options.compilerArgs += ['-Xlint:all,-classfile', '-Werror']
		}

		java {
			sourceCompatibility = JavaVersion.VERSION_21
			targetCompatibility = JavaVersion.VERSION_21
		}
	}

	plugins.withId('net.ltgt.errorprone') {
		dependencies {
			errorprone "com.google.errorprone:error_prone_core:${rootProject.errorprone_version}"
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.errorprone {
				disable('ArrayRecordComponent', 'AssignmentExpression', 'EnumOrdinal',
						'ExposedPrivateType', 'IdentityHashMapUsage', 'OperatorPrecedence', 'ReferenceEquality',
						'RefactorSwitch', 'RethrowReflectiveOperationExceptionAsLinkageError', 'SameNameButDifferent', 'StringSplitter')
			}
		}
	}
}
