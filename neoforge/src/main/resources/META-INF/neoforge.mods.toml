modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Neil-001/chroma-studio/issues"

# Client-only: the one entrypoint is @Mod(dist = Dist.CLIENT), so a server that has the jar loads nothing from it.
# The mod registers no payloads or registry entries, so a server never checks for it.
[[mods]]
modId = "chromastudio"
version = "${version}"
displayName = "Chroma Studio"
displayURL = "https://modrinth.com/mod/chroma-studio"
iconFile = "assets/chromastudio/icon.png"
authors = "Neil C."
description = '''Find blocks by colour, build palettes and gradients, and export them as schematics.'''

[[dependencies.chromastudio]]
modId = "neoforge"
type = "required"
versionRange = "[21.11.42,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.chromastudio]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.11]"
ordering = "NONE"
side = "CLIENT"
