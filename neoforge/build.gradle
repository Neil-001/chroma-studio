plugins {
	id 'net.neoforged.moddev' version '2.0.148'
	id 'net.ltgt.errorprone'
}

repositories {
	maven {
		name = 'Masa'
		url = 'https://masa.dy.fi/maven/sakura-ryoko'
		content { includeGroupByRegex 'fi\\.dy\\.masa\\..*' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Fabric'
				url = 'https://maven.fabricmc.net/'
			}
		}
		filter { includeModule 'net.fabricmc', 'fabric-loader' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'BlameJared'
				url = 'https://maven.blamejared.com/'
			}
		}
		filter { includeGroup 'mezz.jei' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Shedaniel'
				url = 'https://maven.shedaniel.me/'
			}
		}
		filter {
			includeGroup 'me.shedaniel'
			includeGroup 'me.shedaniel.cloth'
			includeGroup 'dev.architectury'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Pinned'
				url = rootProject.file('libs')
				metadataSources { artifact() }
			}
		}
		filter {
			includeGroup 'com.github.Moulberry'
			includeGroup 'com.github.moulberry.imgui-java'
		}
	}
}

neoForge {
	version = project.neoforge_version
	runs {
		client {
			client()
			gameDirectory = rootProject.file('run/neoforge')
		}
	}
	mods {
		"chromastudio" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java.srcDir rootProject.file('src/main/java')
		java.srcDir rootProject.file('src/client/java')
		resources.srcDir rootProject.file('src/main/resources')
	}
}

dependencies {
	compileOnly("com.github.Moulberry:AxiomClientAPI:${project.axiom_api_version}") { transitive = false }
	compileOnly("com.github.moulberry.imgui-java:imgui-java-binding:${project.axiom_imgui_version}") { transitive = false }
	compileOnly("fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}") { transitive = false }
	compileOnly("fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}") { transitive = false }
	compileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}") { transitive = false }
	compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.rei_version}") { transitive = false }
	compileOnly("dev.architectury:architectury-neoforge:${project.architectury_version}") { transitive = false }
	compileOnly("net.fabricmc:fabric-loader:${project.loader_version}") { transitive = false }
	if (findProperty('viewer') == 'jei') {
		runtimeOnly("mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}") { transitive = false }
	}
	if (findProperty('viewer') == 'rei') {
		runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}")
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}
