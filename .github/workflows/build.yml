name: Build

on:
  pull_request:
  push:
    branches: [main, '**/stable']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test release and listing scripts
        run: |
          pip install --quiet markdown
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check the CurseForge listing is up to date
        run: python3 listing/art/curseforge.py --check

      - run: ./gradlew build --profile

      - run: >
          ./gradlew :fabric:compileJava :fabric:compileClientJava :neoforge:compileJava
          -Pfabric_version=0.116.17+1.21.1 -Pneoforge_version=21.1.264

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: |
            build/reports/profile/
            fabric/build/test-results/test/
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: fabric/build/reports/tests/
          retention-days: 7
