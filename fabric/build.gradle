plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
	id 'net.ltgt.errorprone'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	maven {
		name = 'Masa'
		url = 'https://masa.dy.fi/maven/sakura-ryoko'
		content { includeGroupByRegex 'fi\\.dy\\.masa\\..*' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'BlameJared'
				url = 'https://maven.blamejared.com/'
			}
		}
		filter { includeGroup 'mezz.jei' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Shedaniel'
				url = 'https://maven.shedaniel.me/'
			}
		}
		filter {
			includeGroup 'me.shedaniel'
			includeGroup 'me.shedaniel.cloth'
			includeGroup 'dev.architectury'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Pinned'
				url = rootProject.file('libs')
				metadataSources { artifact() }
			}
		}
		filter {
			includeGroup 'com.github.Moulberry'
			includeGroup 'com.github.moulberry.imgui-java'
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"chromastudio" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		client { runDir = '../run/fabric' }
	}
}

sourceSets {
	main {
		java.srcDir rootProject.file('src/main/java')
		resources.srcDir rootProject.file('src/main/resources')
	}
	client {
		java.srcDir rootProject.file('src/client/java')
	}
	test {
		java.srcDir rootProject.file('src/test/java')
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	modCompileOnly("fi.dy.masa.litematica:litematica-fabric-${project.litematica_minecraft}:${project.litematica_version}") { transitive = false }
	modCompileOnly("fi.dy.masa.malilib:malilib-fabric-${project.litematica_minecraft}:${project.malilib_version}") { transitive = false }
	modLocalRuntime("fi.dy.masa.litematica:litematica-fabric-${project.litematica_minecraft}:${project.litematica_version}") { transitive = false }
	modLocalRuntime("fi.dy.masa.malilib:malilib-fabric-${project.litematica_minecraft}:${project.malilib_version}") { transitive = false }
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}") { transitive = false }
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
	modCompileOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
	if (findProperty('viewer') == 'jei') {
		modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") { transitive = false }
	}
	if (findProperty('viewer') == 'rei') {
		modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")
	}

	compileOnly("com.github.Moulberry:AxiomClientAPI:${project.axiom_api_version}") { transitive = false }
	compileOnly("com.github.moulberry.imgui-java:imgui-java-binding:${project.axiom_imgui_version}") { transitive = false }

	testImplementation("com.github.Moulberry:AxiomClientAPI:${project.axiom_api_version}") { transitive = false }
	testImplementation "org.luaj:luaj-jse:3.0.1"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	systemProperty 'chroma.timing', System.getProperty('chroma.timing', 'false')
	def sourceRules = fileTree(rootDir) {
		include '**/*.java', '**/CLAUDE.md', '**/AGENTS.md', '**/build.gradle'
		exclude '**/.git/**', '**/.gradle/**', '**/.idea/**'
		['', 'fabric/', 'neoforge/'].each { dir -> ['bin', 'build', 'logs', 'out', 'run'].each { exclude "${dir}${it}/**" } }
	}
	inputs.files(sourceRules).withPropertyName('sourceRules')
	inputs.property('sourceRuleLinks', providers.provider {
		sourceRules.matching { include '**/AGENTS.md' }.files
				.findAll { java.nio.file.Files.isSymbolicLink(it.toPath()) }
				.collect { "${rootDir.toPath().relativize(it.toPath())} ${java.nio.file.Files.readSymbolicLink(it.toPath())}".toString() }.sort()
	})
	testLogging {
		events "failed"
		exceptionFormat = "full"
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
