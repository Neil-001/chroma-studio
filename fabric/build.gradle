plugins {
	id 'net.fabricmc.fabric-loom' version '1.18.2'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	maven {
		name = 'Masa'
		url = 'https://masa.dy.fi/maven/sakura-ryoko'
		content { includeGroupByRegex 'fi\\.dy\\.masa\\..*' }
	}
	// Each of these groups is asked for from its own Maven alone, so another repository's outage can't fail the build.
	exclusiveContent {
		forRepository {
			maven {
				name = 'BlameJared'
				url = 'https://maven.blamejared.com/'
			}
		}
		filter { includeGroup 'mezz.jei' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Shedaniel'
				url = 'https://maven.shedaniel.me/'
			}
		}
		filter {
			includeGroup 'me.shedaniel'
			includeGroup 'me.shedaniel.cloth'
			includeGroup 'dev.architectury'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Pinned'
				url = rootProject.file('libs')
				metadataSources { artifact() }
			}
		}
		filter {
			includeGroup 'com.github.Moulberry'
			includeGroup 'com.github.moulberry.imgui-java'
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"chromastudio" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		client { runDir = '../run/fabric' }
	}
}

sourceSets {
	main {
		java.srcDir rootProject.file('src/main/java')
		resources.srcDir rootProject.file('src/main/resources')
	}
	client {
		java.srcDir rootProject.file('src/client/java')
	}
	test {
		java.srcDir rootProject.file('src/test/java')
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	compileOnly("fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}") { transitive = false }
	compileOnly("fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}") { transitive = false }
	localRuntime("fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}") { transitive = false }
	localRuntime("fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}") { transitive = false }
	compileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}") { transitive = false }
	compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
	// REI's API names Architectury's types in the methods used.
	compileOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
	if (findProperty('viewer') == 'jei') {
		localRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") { transitive = false }
	}
	if (findProperty('viewer') == 'rei') {
		localRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")
	}

	compileOnly("com.github.Moulberry:AxiomClientAPI:${project.axiom_api_version}") { transitive = false }
	compileOnly("com.github.moulberry.imgui-java:imgui-java-binding:${project.axiom_imgui_version}") { transitive = false }

	testImplementation("com.github.Moulberry:AxiomClientAPI:${project.axiom_api_version}") { transitive = false }
	testImplementation "org.luaj:luaj-jse:3.0.1"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	systemProperty 'chroma.timing', System.getProperty('chroma.timing', 'false')
	testLogging {
		events "failed"
		exceptionFormat = "full"
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
