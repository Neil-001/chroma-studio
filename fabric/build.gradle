plugins {
	// Loom 1.18 and later need Java 25 to run Gradle. The release workflow builds this branch with Java 21.
	id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	maven {
		name = 'Masa'
		url = 'https://masa.dy.fi/maven/sakura-ryoko'
		content { includeGroupByRegex 'fi\\.dy\\.masa\\..*' }
	}
	// Each of these groups is asked for from its own Maven alone, so another repository's outage can't fail the build.
	exclusiveContent {
		forRepository {
			maven {
				name = 'BlameJared'
				url = 'https://maven.blamejared.com/'
			}
		}
		filter { includeGroup 'mezz.jei' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Shedaniel'
				url = 'https://maven.shedaniel.me/'
			}
		}
		filter {
			includeGroup 'me.shedaniel'
			includeGroup 'me.shedaniel.cloth'
			includeGroup 'dev.architectury'
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"chromastudio" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		client { runDir = '../run/fabric' }
	}
}

// The shared code, next to this project's own Fabric entrypoints.
sourceSets {
	main {
		java.srcDir rootProject.file('src/main/java')
		resources.srcDir rootProject.file('src/main/resources')
	}
	client {
		java.srcDir rootProject.file('src/client/java')
	}
	test {
		java.srcDir rootProject.file('src/test/java')
		// For the client classes that don't need the game running, such as ModSettings.
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.11 is obfuscated, so the code uses Mojang's names and Loom remaps the jar to the game's.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Mod Menu is optional: only its entrypoint class refers to it, and only Mod Menu loads that class.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// The dev client runs with it, to try the settings screen from its mod list.
	modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	// Litematica is optional too: only the bridge class refers to it, and only once the mod is known to be loaded.
	// The dev client runs with both, to try the bridge. Their own dependencies are left out: the jars carry what they need.
	modCompileOnly("fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}") { transitive = false }
	modCompileOnly("fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}") { transitive = false }
	modLocalRuntime("fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}") { transitive = false }
	modLocalRuntime("fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}") { transitive = false }
	// The recipe viewers are optional as well: only RecipeViewers and JEI's own plugin class refer to them.
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}") { transitive = false }
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
	// REI's API names Architectury's types in the methods used.
	modCompileOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
	// To try the recipe key, run the dev client with one of them: ./gradlew :fabric:runClient -Pviewer=jei (or rei)
	if (findProperty('viewer') == 'jei') {
		modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") { transitive = false }
	}
	if (findProperty('viewer') == 'rei') {
		modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")
	}

	// Tests cover the pure-Java core (dev.chromastudio.core), the settings file, and the block index against the game's own assets.
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// Timing tests are off unless asked for: ./gradlew :fabric:test -Dchroma.timing=true
	systemProperty 'chroma.timing', System.getProperty('chroma.timing', 'false')
	testLogging {
		events "failed"
		exceptionFormat = "full"
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
