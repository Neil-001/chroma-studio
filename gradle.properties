org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric: the first Fabric API build after 1.21.11 was released (check https://fabricmc.net/develop for newer builds)
minecraft_version=1.21.11
loader_version=0.19.5
fabric_version=0.139.5+1.21.11
# Mod Menu, compiled against but not required (see https://modrinth.com/mod/modmenu/versions)
modmenu_version=17.0.0

# NeoForge: the first stable release for 1.21.11 (see https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=21.11.42

# Litematica and MaLiLib, compiled against but not required (see https://masa.dy.fi/maven/sakura-ryoko). 1.21.11 is obfuscated, so
# NeoForge compiles against Forgematica and MaFgLib instead, their NeoForge ports with Mojang's names, from Modrinth's maven
# (https://modrinth.com/mod/forgematica/versions and https://modrinth.com/mod/mafglib/versions).
litematica_version=0.26.16
malilib_version=0.27.20
forgematica_version=0.4.3+mc1.21.11
mafglib_version=0.4.7+mc1.21.11

# Recipe viewers, compiled against but not required. JEI: https://maven.blamejared.com/mezz/jei, REI: https://maven.shedaniel.me/me/shedaniel.
# EMI (https://maven.terraformersmc.com/releases/dev/emi) is called by name, as on main, so its API isn't needed.
jei_version=27.53.0.108
rei_version=21.11.816
architectury_version=19.0.1

mod_version=1.1.0
maven_group=dev.chromastudio
archives_base_name=chromastudio
