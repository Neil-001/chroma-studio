org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric: the first Fabric API build after 26.3 was released (check https://fabricmc.net/develop for newer builds)
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.160.6+26.3
# Mod Menu, compiled against but not required (see https://modrinth.com/mod/modmenu/versions)
modmenu_version=21.0.0

# NeoForge: the first beta release for 26.3 (see https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=26.3.0.0-beta

# Litematica and MaLiLib, compiled against but not required (see https://masa.dy.fi/maven/sakura-ryoko)
litematica_version=0.29.1
malilib_version=0.30.2

# Recipe viewers, compiled against but not required. JEI: https://maven.blamejared.com/mezz/jei, REI: https://maven.shedaniel.me/me/shedaniel.
# EMI has no 26.3 release yet (https://maven.terraformersmc.com/releases/dev/emi), so RecipeViewers calls it by name.
jei_version=31.12.0.65
rei_version=26.3.824
architectury_version=22.0.3

mod_version=1.1.0
maven_group=dev.chromastudio
archives_base_name=chromastudio
