org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric: the first Fabric API build for 1.21.1. The jar also accepts 0.100.1+1.21, the first for 1.21, which has
# everything it uses (check https://fabricmc.net/develop for newer builds)
minecraft_version=1.21.1
loader_version=0.19.5
fabric_version=0.101.2+1.21.1
# Mod Menu, compiled against but not required (see https://modrinth.com/mod/modmenu/versions)
modmenu_version=11.0.1

# NeoForge: the first stable release for 1.21.1 (see https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=21.1.1

# Litematica and MaLiLib, compiled against but not required (see https://masa.dy.fi/maven/sakura-ryoko). Their 1.21 builds
# run on 1.21.1 too, and 1.21.1 is obfuscated, so NeoForge compiles against Forgematica and MaFgLib instead, their NeoForge
# ports with Mojang's names, from Modrinth's maven (https://modrinth.com/mod/forgematica/versions and
# https://modrinth.com/mod/mafglib/versions).
litematica_minecraft=1.21
litematica_version=0.19.61
malilib_version=0.21.10
forgematica_version=0.4.2+mc1.21.1
mafglib_version=0.4.3+mc1.21.1

# Recipe viewers, compiled against but not required. JEI: https://maven.blamejared.com/mezz/jei, REI: https://maven.shedaniel.me/me/shedaniel.
# EMI (https://maven.terraformersmc.com/releases/dev/emi) is called by name, as on main, so its API isn't needed.
jei_version=19.69.0.456
rei_version=16.0.799
architectury_version=13.0.6

mod_version=1.1.0
maven_group=dev.chromastudio
archives_base_name=chromastudio
