org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric: the first Fabric API build after 26.2 was released (check https://fabricmc.net/develop for newer builds)
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.152.2+26.2
# Mod Menu, compiled against but not required (see https://modrinth.com/mod/modmenu/versions)
modmenu_version=20.0.0

# NeoForge: the first stable release for 26.2 (see https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=26.2.0.57

# Litematica and MaLiLib, compiled against but not required (see https://masa.dy.fi/maven/sakura-ryoko)
litematica_version=0.28.8
malilib_version=0.29.6

# Recipe viewers, compiled against but not required. JEI: https://maven.blamejared.com/mezz/jei, REI: https://maven.shedaniel.me/me/shedaniel.
# EMI has no 26.2 release (https://maven.terraformersmc.com/releases/dev/emi), so RecipeViewers calls it by name.
jei_version=30.47.0.238
rei_version=26.2.821
architectury_version=21.0.2

mod_version=1.1.0
maven_group=dev.chromastudio
archives_base_name=chromastudio
